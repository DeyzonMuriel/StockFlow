{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockFlow | Editar Categoria</title>

    <link rel="stylesheet" href="{% static 'estoque/style.css' %}">
</head>

<body>

    <header>
        <h1>StockFlow</h1>
        <p>Edição de categorias</p>
    </header>

    <nav class="menu">
        <a href="/">Início</a>
        <a href="/produtos/">Produtos</a>
        <a href="/categorias/">Categorias</a>
        <a href="/fornecedores/">Fornecedores</a>
        <a href="/admin/">Administração</a>
    </nav>

    <main>

        <h2>Editar Categoria</h2>

        {% if erro %}
            <p class="mensagem-erro">{{ erro }}</p>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <label for="nome">Nome da categoria:</label>

            <input
                type="text"
                id="nome"
                name="nome"
                maxlength="100"
                value="{{ categoria.nome }}"
                required
            >

            <label for="descricao">Descrição:</label>

            <textarea
                id="descricao"
                name="descricao"
            >{{ categoria.descricao }}</textarea>

            <button type="submit">
                Salvar Alterações
            </button>

        </form>

        <p>
            <a href="{% url 'listar_categorias' %}" class="botao">
                Voltar para categorias
            </a>
        </p>

    </main>

</body>
</html>
