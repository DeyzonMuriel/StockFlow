{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockFlow | Cadastrar Fornecedor</title>

    <link rel="stylesheet" href="{% static 'estoque/style.css' %}">
</head>

<body>

    <header>
        <h1>StockFlow</h1>
        <p>Cadastro de fornecedores</p>
    </header>

    <nav class="menu">
        <a href="/">Início</a>
        <a href="/produtos/">Produtos</a>
        <a href="/categorias/">Categorias</a>
        <a href="/fornecedores/">Fornecedores</a>
        <a href="/admin/">Administração</a>
    </nav>

    <main>

        <h2>Cadastrar Fornecedor</h2>

        {% if erro %}
            <p class="mensagem-erro">{{ erro }}</p>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <label for="nome">Nome do fornecedor:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                maxlength="150"
                required
            >

            <label for="cnpj">CNPJ:</label>
            <input
                type="text"
                id="cnpj"
                name="cnpj"
                maxlength="18"
                placeholder="Opcional"
            >

            <label for="email">E-mail:</label>
            <input
                type="email"
                id="email"
                name="email"
            >

            <label for="telefone">Telefone:</label>
            <input
                type="text"
                id="telefone"
                name="telefone"
                maxlength="20"
            >

            <label for="endereco">Endereço:</label>
            <textarea
                id="endereco"
                name="endereco"
            ></textarea>

            <button type="submit">
                Cadastrar Fornecedor
            </button>

        </form>

    </main>

</body>
</html>
