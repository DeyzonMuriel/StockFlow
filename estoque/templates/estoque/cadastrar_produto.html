{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockFlow | Cadastrar Produto</title>

    <link rel="stylesheet" href="{% static 'estoque/style.css' %}">
</head>

<body>

    <header>
        <h1>StockFlow</h1>
        <p>Cadastro de produtos</p>
    </header>

    <nav class="menu">
        <a href="/">Início</a>
        <a href="/produtos/">Produtos</a>
        <a href="/categorias/">Categorias</a>
        <a href="/fornecedores/">Fornecedores</a>
        <a href="/admin/">Administração</a>
    </nav>

    <main>
        <h2>Cadastrar Produto</h2>

        <form method="post">
            {% csrf_token %}

            <label for="nome">Nome do produto:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="sku">SKU:</label>
            <input type="text" id="sku" name="sku" required>

            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao"></textarea>

            <label for="preco">Preço:</label>
            <input type="number" id="preco" name="preco"
                   min="0" step="0.01" required>

            <label for="quantidade_estoque">Quantidade em estoque:</label>
            <input type="number" id="quantidade_estoque"
                   name="quantidade_estoque" min="0" value="0" required>

            <label for="estoque_minimo">Estoque mínimo:</label>
            <input type="number" id="estoque_minimo"
                   name="estoque_minimo" min="0" value="0" required>

            <label for="categoria">Categoria:</label>
            <select id="categoria" name="categoria" required>
                <option value="">Selecione uma categoria</option>
                {% for categoria in categorias %}
                    <option value="{{ categoria.id }}">
                        {{ categoria.nome }}
                    </option>
                {% endfor %}
            </select>

            <label for="fornecedor">Fornecedor:</label>
            <select id="fornecedor" name="fornecedor" required>
                <option value="">Selecione um fornecedor</option>
                {% for fornecedor in fornecedores %}
                    <option value="{{ fornecedor.id }}">
                        {{ fornecedor.nome }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Cadastrar Produto</button>
        </form>
    </main>

</body>
</html>
