{% extends "estoque/base.html" %}

{% block content %}

<h1>Editar Fornecedor</h1>

{% if erro %}
    <p class="mensagem-erro">{{ erro }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <label>Nome:</label>
    <input type="text" name="nome" value="{{ fornecedor.nome }}" required>

    <label>CNPJ:</label>
    <input type="text" name="cnpj" value="{{ fornecedor.cnpj|default_if_none:'' }}">

    <label>E-mail:</label>
    <input type="email" name="email" value="{{ fornecedor.email }}">

    <label>Telefone:</label>
    <input type="text" name="telefone" value="{{ fornecedor.telefone }}">

    <label>Endereço:</label>
    <input type="text" name="endereco" value="{{ fornecedor.endereco }}">

    <button type="submit">Salvar Alterações</button>
</form>

<a href="{% url 'listar_fornecedores' %}">Voltar</a>

{% endblock %}
